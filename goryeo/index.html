<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고려 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#10201c;--bg2:#1a332d;--ink:#fbf4e4;--dim:#b9c9c1;--cel:#6fc2a6;--cel2:#3f8f78;--gold:#f2c14e;--red:#ff6b5e;--paper:#fbf4e4;--paperInk:#2a2420;
--disp:"Black Han Sans","Jua",system-ui,sans-serif;--body:"Jua",system-ui,sans-serif;--read:"Gowun Dodum","Jua",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1100px 700px at 50% -10%,var(--bg2),var(--bg) 70%) fixed var(--bg);color:var(--ink);font-family:var(--body);
  padding:0 max(16px,env(safe-area-inset-left)) 40px;-webkit-tap-highlight-color:transparent;font-size:18px}
.wrap{max-width:880px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
header .logo{font-family:var(--disp);font-size:24px;color:var(--gold);letter-spacing:1px}
header .keys{margin-left:auto;display:flex;gap:6px;font-size:22px}
header .keys span{opacity:.25;filter:grayscale(1);transition:.3s}header .keys span.on{opacity:1;filter:none;transform:scale(1.1)}
.icon{background:#ffffff14;border:0;color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
h1{font-family:var(--disp);font-weight:400;margin:0;font-size:clamp(34px,7vw,64px);line-height:1.15;text-wrap:balance;
  background:linear-gradient(180deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0007)}
h2{font-family:var(--disp);font-weight:400;font-size:clamp(24px,4.5vw,36px);margin:6px 0 10px;color:var(--gold)}
p{line-height:1.6;margin:.4em 0}
.btn{font-family:var(--disp);border:0;border-radius:18px;padding:.55em 1.2em;cursor:pointer;color:#14231f;background:var(--gold);
  box-shadow:0 6px 0 #a98318;font-size:22px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a98318}
.btn.cel{background:var(--cel);box-shadow:0 6px 0 var(--cel2)}
.btn.ghost{background:#ffffff1c;color:var(--ink);box-shadow:0 6px 0 #0006}
.btn:focus-visible,button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.center{text-align:center}
.story{background:#0006;border-radius:20px;padding:18px 20px;margin:18px 0;font-family:var(--read);font-size:19px;line-height:1.8}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:14px}
.theme{border:0;cursor:pointer;text-align:left;border-radius:22px;padding:22px;color:var(--paperInk);background:var(--paper);box-shadow:0 8px 0 #0007;font-family:var(--body)}
.theme .e{font-size:54px}.theme b{display:block;font-family:var(--disp);font-size:28px;font-weight:400;margin:6px 0 2px}
.theme span{color:#6b5d50;font-size:17px}
.memo{display:flex;gap:12px;align-items:flex-start;background:#fff4c9;color:#3b2f10;border-radius:16px;padding:14px 16px;margin:14px 0;box-shadow:0 5px 0 #0006;font-size:19px;line-height:1.55;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.memo .pen{font-size:30px;line-height:1}
.memo b{color:#9a3d00}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
@media (max-width:560px){.doors{grid-template-columns:repeat(2,1fr)}}
.door{position:relative;border:0;cursor:pointer;border-radius:18px 18px 8px 8px;padding:18px 8px 14px;min-height:150px;
  background:linear-gradient(180deg,#6b4a2f,#4a3220);color:#fbe9cf;box-shadow:inset 0 0 0 4px #00000033,0 7px 0 #0008;font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door .e{font-size:44px}.door .n{font-size:19px;text-align:center}.door .lk{position:absolute;top:8px;right:10px;font-size:20px}
.door.done{background:linear-gradient(180deg,var(--cel),var(--cel2));color:#08251d;cursor:default}
.door.locked{opacity:.4;cursor:not-allowed}
.card{background:var(--paper);color:var(--paperInk);border-radius:20px;padding:20px 22px;box-shadow:0 8px 0 #0007;margin-top:8px}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#7a6a5a;font-size:15px}
.card .tag{background:#2a2420;color:#fbf4e4;border-radius:999px;padding:2px 10px;font-size:14px}
.card h3{font-family:var(--disp);font-weight:400;font-size:28px;margin:8px 0 6px}
.card .tx{font-family:var(--read);font-size:20px;line-height:1.85}
.card .find{margin-top:10px;font-size:15px;color:#7a6a5a}
.lock{margin-top:18px;background:#0007;border-radius:20px;padding:18px}
.lock .h{font-family:var(--disp);font-size:22px;color:var(--gold);margin-bottom:8px}
.opts{display:grid;gap:10px}
.opt{border:0;cursor:pointer;text-align:left;border-radius:14px;padding:14px 16px;font-family:var(--read);font-size:19px;background:#ffffff18;color:var(--ink);box-shadow:0 4px 0 #0006}
.opt.no{background:#ff6b5e44;animation:shake .4s}.opt.ok{background:var(--cel);color:#08251d}
.hint{color:#ffb0a8;min-height:1.6em;margin-top:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chip{border:0;cursor:pointer;border-radius:999px;padding:10px 18px;font-family:var(--body);font-size:20px;background:#ffffff1c;color:var(--ink);box-shadow:0 4px 0 #0006}
.chip.no{background:#ff6b5e55;animation:shake .4s}.chip.ok{background:var(--gold);color:#14231f}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.mini{grid-template-columns:1fr}}
.mini .card{padding:14px 16px;margin:0;transition:.3s}
.mini .card h3{font-size:21px}.mini .card .tx{font-size:16px;line-height:1.7}
.mini .card.glow{box-shadow:0 0 0 5px var(--gold),0 8px 0 #0007}
.frame{background:#fff4c9;color:#3b2f10;border-radius:16px;padding:16px;font-size:21px;line-height:1.9;font-family:var(--read)}
.frame u{text-decoration:none;border-bottom:3px solid #9a3d00;padding:0 4px;color:#9a3d00;font-weight:700}
.bigdoor{font-size:120px;text-align:center;margin:10px 0;animation:bob 2s ease-in-out infinite}
.flash{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none}
.flash span{font-family:var(--disp);font-size:min(20vh,22vw);color:var(--gold);text-shadow:0 8px 0 #0009;animation:slam .9s cubic-bezier(.2,1.6,.4,1) both}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--paper);color:var(--paperInk);border-radius:20px;padding:22px;max-width:460px;width:100%;text-align:center;font-size:20px;animation:pop .35s both}
.modal .box .row .btn{font-size:20px}
.foot{margin-top:28px;text-align:center}
.foot button{background:none;border:0;color:#ffffff55;font-family:var(--body);font-size:15px;cursor:pointer;text-decoration:underline}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:45}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes slam{from{transform:scale(3);opacity:0}60%{opacity:1}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header><span class="logo">🔐 고려 방탈출</span><div class="keys" id="keys"><span>🗝️</span><span>🗝️</span><span>🗝️</span></div>
  <button class="icon" id="snd" aria-label="소리 켜고 끄기">🔊</button></header>
  <main id="app"></main>
  <div class="foot"><button id="restart">처음부터 다시 하기</button></div>
</div>
<script>

   return '<button class="door'+(d?' done':(full?' locked':''))+'" data-id="'+r.id+'"><span class="lk">'+(d?'🗝️':'🔒')+'</span><span class="e">'+r.emo+'</span><span class="n">'+r.room+'</span></button>'}).join('')+'</div>'+
  (full?'<div class="row"><button class="btn" id="fin">🚪 마지막 문으로!</button></div>':'');
  a.querySelectorAll('.door').forEach(function(b){b.onclick=function(){var id=b.dataset.id;if(S.opened.indexOf(id)>=0||full)return;sfx.door();S.cur=id;S.phase='read';go('room')}});
  if(full)$('#fin').onclick=function(){sfx.door();S.keyTag=null;S.phase='key';go('final')};return}
 if(S.step==='room'){roomScreen(a);return}
 if(S.step==='final'){finalScreen(a);return}
 if(S.step==='end'){a.innerHTML='<div class="center"><div class="bigdoor">🌅</div><h1>탈출 성공!</h1><p style="font-size:22px">천 년 전 고려에서 무사히 돌아왔어요.</p></div>'+
  '<div class="memo"><span class="pen">📝</span><div>활동지 <b>❺번 소감</b>을 써요.<br>· 고려에서 가장 놀라웠던 점은?<br>· 친구는 어떤 열쇠 낱말로 탈출했는지 물어보고, 나와 다른 점을 써요.</div></div>'+
  '<div class="card"><div class="meta">내 열쇠 낱말</div><h3>🗝️ '+esc(S.ownKey?'내가 찾은 열쇠 낱말':S.keyTag)+'</h3><div class="tx">열어 본 방: '+S.opened.map(function(id){return esc(room(id).room)}).join(' · ')+'</div></div>';confetti(160);return}
}
function roomScreen(a){var r=room(S.cur),i=S.opened.length,n=NUM[i];
 var card='<div class="card"><div class="meta"><span class="tag">'+r.type+'</span>'+esc(r.when)+'</div><h3>'+r.emo+' '+esc(r.name)+'</h3><div class="tx">'+esc(r.text)+'</div><div class="find">🔍 '+esc(r.find)+'</div></div>';
 var head='<h2>'+r.emo+' '+esc(r.room)+'</h2><p>방 한가운데 낡은 쪽지가 놓여 있어요.</p>';
 if(S.phase==='read'){var o=shuffle(r.opts.map(function(x,k){return{t:x,ok:k===0}}));
  a.innerHTML=head+card+'<div class="lock"><div class="h">🔒 자물쇠 1 · 쪽지를 잘 읽었나요?</div><p>'+esc(r.q)+'</p><div class="opts">'+o.map(function(x,k){return '<button class="opt" data-ok="'+(x.ok?1:0)+'">'+esc(x.t)+'</button>'}).join('')+'</div><div class="hint" id="hint"></div></div>';
  a.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){if(b.dataset.ok==='1'){b.classList.add('ok');sfx.ok();flash('철컥!');setTimeout(function(){S.phase='row';go('room')},900)}else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.no();$('#hint').textContent='앗, 자물쇠가 꿈쩍도 안 해요. 쪽지를 다시 읽어 봐요!'}}});return}
 if(S.phase==='row'){a.innerHTML=head+card+'<div class="lock"><div class="h">🔓 자물쇠 1 풀림!</div></div>'+
  '<div class="memo"><span class="pen">📝</span><div>활동지 <b>❷번 표의 '+n+'번 줄</b>을 채워요.<br>· 단서 이름: <b>'+esc(r.name)+'</b><br>· 종류: <b>'+r.type+'</b><br>· 보이는 것: 쪽지에서 본 것을 <b>한두 줄</b>로</div></div>'+
  '<div class="row"><button class="btn cel" id="b">다 썼어요</button></div>';$('#b').onclick=function(){sfx.click();S.phase='think';go('room')};return}
 if(S.phase==='think'){a.innerHTML=head+card+'<div class="lock"><div class="h">🔒 자물쇠 2 · 생각의 자물쇠</div><p style="font-size:21px">이 쪽지를 보면, <b>고려 사람들은 어떻게 살았을까?</b></p>'+
  '<p style="color:var(--dim)">쪽지에 직접 쓰여 있지 않은 것을 짐작해 봐요. “그렇다면 고려에서는 ~했을 거야!”</p></div>'+
  '<div class="memo"><span class="pen">📝</span><div>활동지 <b>❸번 방 '+n+' 추리 메모</b>에 써요.<br>단서 이름을 쓰고, <b>“~했을 것이다.”</b>로 끝나게!</div></div>'+
  '<div class="row"><button class="btn cel" id="b">다 썼어요</button></div>';
  $('#b').onclick=function(){ask('추리 메모가 <b>“~했을 것이다.”</b>로 끝났나요?','네! 열어 줘','잠깐, 고칠래',function(y){if(!y)return;S.opened.push(r.id);S.phase=null;save();sfx.key();flash('🗝️');keys();confetti(70);setTimeout(function(){go('map')},1000)})};return}
}
function finalScreen(a){var t=th(),op=S.opened.map(room);
 var mini='<div class="mini">'+op.map(function(r){return '<div class="card" data-id="'+r.id+'"><div class="meta"><span class="tag">'+r.type+'</span></div><h3>'+r.emo+' '+esc(r.name)+'</h3><div class="tx">'+esc(r.text)+'</div></div>'}).join('')+'</div>';
 if(S.phase==='key'){var tags=shuffle(Object.keys(t.tags));
  a.innerHTML='<div class="center"><div class="bigdoor" style="font-size:90px">🚪</div></div><h2>마지막 문</h2><p>문에 열쇠 구멍이 세 개! 내가 연 세 방의 쪽지를 나란히 놓았어요.</p>'+mini+
  '<div class="lock"><div class="h">🔒 마지막 자물쇠 · 열쇠 낱말 찾기</div><p>세 쪽지 가운데 <b>두 개 이상</b>에 함께 보이는 것은 무엇일까요?</p><div class="chips">'+tags.map(function(g){return '<button class="chip">'+esc(g)+'</button>'}).join('')+'</div>'+
  '<div class="hint" id="hint"></div><p style="color:var(--dim);font-size:16px">여기 없는 다른 공통점을 찾았다면? 👉 <button class="chip" id="own" style="font-size:16px;padding:6px 12px">내가 찾은 열쇠 낱말이 있어요</button></p></div>';
  a.querySelectorAll('.chips .chip').forEach(function(b){b.onclick=function(){var g=b.textContent,hit=op.filter(function(r){return t.tags[g].indexOf(r.id)>=0});
   if(hit.length>=2){b.classList.add('ok');sfx.key();hit.forEach(function(r){a.querySelector('.mini .card[data-id="'+r.id+'"]').classList.add('glow')});S.keyTag=g;S.ownKey=false;save();
    setTimeout(function(){S.phase='write';go('final')},1600)}else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');sfx.no();
    $('#hint').textContent=hit.length===1?'이 낱말은 한 쪽지에서만 보여요. 두 쪽지 이상에 함께 나오는 것을 찾아요!':'내가 연 쪽지에는 이 낱말이 안 보여요. 다시 읽어 봐요!'}}});
  $('#own').onclick=function(){ask('찾은 열쇠 낱말을 활동지 <b>❹번 열쇠 낱말 칸</b>에 먼저 썼나요?<br><small>선생님께 보여 드리고 확인받아요.</small>','네, 썼어요','아직',function(y){if(!y)return;S.ownKey=true;S.keyTag='';S.phase='write';go('final')})};return}
 if(S.phase==='write'){var g=S.ownKey?'(내가 찾은 열쇠 낱말)':S.keyTag;
  a.innerHTML='<h2>🗝️ 열쇠 낱말: '+esc(g)+'</h2>'+mini+
  '<div class="memo"><span class="pen">📝</span><div>활동지 <b>❹번</b>을 채워요.<br>· 열쇠 낱말 칸: <b>'+esc(g)+'</b><br>· 아래 문장 틀에 맞춰 <b>열쇠 문장</b>을 써요.</div></div>'+
  '<div class="frame">세 단서를 이어 보면 <u>'+(S.ownKey?'　　　　':esc(g))+'</u>'+(S.ownKey?'이/가':josa(g,'이','가'))+' 보인다.<br>그래서 고려 사람들은 <u>　　　　　　　　　　</u> 했을 것이다.</div>'+
  '<p style="color:var(--dim)">💡 앞에서 쓴 추리 메모 세 개를 다시 읽어 보면 쉬워요.</p><div class="row"><button class="btn" id="b">🚪 문 열기</button></div>';
  $('#b').onclick=function(){ask('열쇠 문장이 <b>“그래서 고려 사람들은 ~했을 것이다.”</b>로 끝났나요?','네! 문 열기','잠깐, 고칠래',function(y){if(!y)return;sfx.win();flash('탈출!');setTimeout(function(){go('end')},900)})};return}
}
$('#restart').onclick=function(){ask('처음부터 다시 할까요?<br><small>지금까지 연 방 기록이 지워져요.</small>','다시 하기','아니요',function(y){if(!y)return;S={step:'intro',theme:null,opened:[],cur:null,phase:null,keyTag:null,ownKey:false};save();render()})};
render();
</script>
</body>
</html>
