<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고려 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#10201c;--bg2:#1a332d;--ink:#fbf4e4;--dim:#b9c9c1;--cel:#6fc2a6;--cel2:#3f8f78;--gold:#f2c14e;--red:#ff6b5e;--paper:#fbf4e4;--paperInk:#2a2420;
--disp:"Black Han Sans","Jua",system-ui,sans-serif;--body:"Jua",system-ui,sans-serif;--read:"Gowun Dodum","Jua",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1100px 700px at 50% -10%,var(--bg2),var(--bg) 70%) fixed var(--bg);color:var(--ink);font-family:var(--body);
  padding:0 max(16px,env(safe-area-inset-left)) 40px;-webkit-tap-highlight-color:transparent;font-size:18px}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
header .logo{font-family:var(--disp);font-size:24px;color:var(--gold);letter-spacing:1px;cursor:pointer}
header .keys{margin-left:auto;display:flex;gap:4px;font-size:20px}
header .keys span{opacity:.22;filter:grayscale(1);transition:.3s}header .keys span.on{opacity:1;filter:none}
.icon{background:#ffffff14;border:0;color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
h1{font-family:var(--disp);font-weight:400;margin:0;font-size:clamp(34px,7vw,64px);line-height:1.15;text-wrap:balance;
  background:linear-gradient(180deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0007)}
h2{font-family:var(--disp);font-weight:400;font-size:clamp(24px,4.5vw,36px);margin:6px 0 10px;color:var(--gold)}
p{line-height:1.6;margin:.4em 0}
.btn{font-family:var(--disp);border:0;border-radius:18px;padding:.55em 1.2em;cursor:pointer;color:#14231f;background:var(--gold);box-shadow:0 6px 0 #a98318;font-size:22px;transition:transform .08s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a98318}
.btn.cel{background:var(--cel);box-shadow:0 6px 0 var(--cel2)}
.btn.ghost{background:#ffffff1c;color:var(--ink);box-shadow:0 6px 0 #0006}
.btn:disabled{opacity:.45}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.center{text-align:center}
.story{background:#0006;border-radius:20px;padding:18px 20px;margin:18px 0;font-family:var(--read);font-size:19px;line-height:1.8}
.memo{display:flex;gap:12px;align-items:flex-start;background:#fff4c9;color:#3b2f10;border-radius:16px;padding:14px 16px;margin:14px 0;box-shadow:0 5px 0 #0006;font-size:19px;line-height:1.6;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.memo .pen{font-size:30px;line-height:1}.memo b{color:#9a3d00}
.doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.door{position:relative;border:0;cursor:pointer;border-radius:18px 18px 8px 8px;padding:16px 8px 12px;min-height:140px;background:linear-gradient(180deg,#6b4a2f,#4a3220);color:#fbe9cf;box-shadow:inset 0 0 0 4px #00000033,0 7px 0 #0008;font-family:var(--body);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.door:hover{transform:translateY(-3px)}
.door.gem{background:linear-gradient(180deg,#2f6b5f,#1d4a40)}
.door .e{font-size:42px}.door .n{font-size:18px;text-align:center}.door .lk{position:absolute;top:8px;right:10px;font-size:18px}
.door .s{font-size:13px;opacity:.8}
.door.done{background:linear-gradient(180deg,var(--cel),var(--cel2));color:#08251d;cursor:default}
.secT{font-family:var(--disp);color:var(--dim);font-size:18px;margin:18px 0 0}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media (max-width:680px){.clues{grid-template-columns:1fr}}
.card{background:var(--paper);color:var(--paperInk);border-radius:18px;padding:16px 18px;box-shadow:0 7px 0 #0007;transition:.3s}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#7a6a5a;font-size:14px}
.card .tag{background:#2a2420;color:#fbf4e4;border-radius:999px;padding:2px 10px;font-size:13px}
.card .no{background:var(--gold);color:#2a2420;border-radius:999px;padding:2px 10px;font-size:13px}
.card h3{font-family:var(--disp);font-weight:400;font-size:23px;margin:6px 0 4px}
.card .tx{font-family:var(--read);font-size:18px;line-height:1.8}
.card .find{margin-top:8px;font-size:14px;color:#7a6a5a}
.card.glow{box-shadow:0 0 0 5px var(--gold),0 7px 0 #0007}
.lock{margin-top:16px;background:#0007;border-radius:20px;padding:18px}
.lock .h{font-family:var(--disp);font-size:22px;color:var(--gold);margin-bottom:8px}
.opts{display:grid;gap:10px}
.opt{border:0;cursor:pointer;text-align:left;border-radius:14px;padding:14px 16px;font-family:var(--read);font-size:19px;background:#ffffff18;color:var(--ink);box-shadow:0 4px 0 #0006;touch-action:manipulation}
.opt.no{background:#ff6b5e44;animation:shake .4s}.opt.ok{background:var(--cel);color:#08251d}
.hint{color:#ffb0a8;min-height:1.6em;margin-top:8px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.secret{background:#3b1f2a;border:2px dashed #ff9fb0;border-radius:16px;padding:14px 16px;margin-top:14px;font-family:var(--read);font-size:19px;line-height:1.7;animation:pop .5s both}
.secret b{color:#ffd3dc}
/* print game */
.stage{background:#0007;border-radius:20px;padding:18px;margin-top:12px;text-align:center}
.board{width:min(420px,90%);margin:12px auto;height:130px;border-radius:12px;background:linear-gradient(135deg,#c79a63,#9c7040);position:relative;overflow:hidden;box-shadow:inset 0 0 0 5px #6b4a2f}
.board .carv{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#3b2414 0 6px,transparent 6px 18px);clip-path:inset(0 100% 0 0);transition:clip-path .15s}
.bar{height:16px;border-radius:9px;background:#ffffff22;overflow:hidden;width:min(420px,90%);margin:8px auto}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.tile{border:0;cursor:pointer;width:62px;height:62px;border-radius:10px;font-family:var(--disp);font-size:30px;background:linear-gradient(180deg,#b9b9b0,#7c7c74);color:#1d1d1a;box-shadow:0 5px 0 #44443f;touch-action:manipulation}
.tile.used{opacity:.25}.tile.no{animation:shake .4s;background:#ff8f86}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0;min-height:66px;flex-wrap:wrap}
.slot{width:62px;height:62px;border-radius:10px;border:3px dashed #ffffff44;display:grid;place-items:center;font-family:var(--disp);font-size:30px}
.slot.f{border:3px solid var(--gold);background:#f2c14e22;color:var(--gold)}
.book{display:inline-block;background:var(--paper);color:var(--paperInk);border-radius:6px 12px 12px 6px;padding:6px 12px;margin:4px;font-family:var(--read);font-size:16px;box-shadow:0 4px 0 #0007}
.fact{background:var(--paper);color:var(--paperInk);border-radius:18px;padding:16px 18px;margin-top:12px;font-family:var(--read);font-size:19px;line-height:1.8;text-align:left}
.fact b{color:#9a3d00}
.big{font-family:var(--disp);font-size:40px;color:var(--gold)}
/* kiln */
.steps{display:grid;gap:10px;max-width:520px;margin:10px auto}
.therm{width:min(460px,92%);height:44px;margin:16px auto 6px;border-radius:22px;background:linear-gradient(90deg,#3a6ea5 0%,#e0a040 50%,#ff3b2f 100%);position:relative;box-shadow:inset 0 0 0 3px #0006}
.therm .zone{position:absolute;top:-6px;bottom:-6px;border:3px solid #fff;border-radius:10px;background:#ffffff26}
.therm .needle{position:absolute;top:-10px;width:6px;height:64px;background:#fff;border-radius:3px;box-shadow:0 0 8px #000}
.temp{font-family:var(--disp);font-size:30px}
.fire{font-size:56px;line-height:1;height:110px;display:flex;align-items:flex-end;justify-content:center;overflow:visible}.fire span{display:inline-block;transform-origin:50% 100%;transition:transform .1s}
/* final */
.keyrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.kk{background:var(--paper);color:var(--paperInk);border-radius:14px;padding:8px 12px;font-size:16px;box-shadow:0 4px 0 #0007;text-align:center}
.kk b{display:block;font-size:22px}
.cho{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-family:var(--disp);font-size:30px;margin:14px 0}
.cho input{font-family:var(--disp);font-size:30px;width:170px;text-align:center;border-radius:14px;border:3px solid var(--gold);background:#0006;color:var(--ink);padding:6px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pk{border:0;cursor:pointer;border-radius:14px;padding:12px;font-family:var(--body);font-size:18px;background:#ffffff18;color:var(--ink);box-shadow:0 4px 0 #0006}
.pk.sel{background:var(--gold);color:#14231f}.pk.no{animation:shake .4s;background:#ff6b5e55}.pk.ok{background:var(--cel);color:#08251d}
.frame{background:#fff4c9;color:#3b2f10;border-radius:16px;padding:16px;font-size:21px;line-height:2;font-family:var(--read)}
.frame u{text-decoration:none;border-bottom:3px solid #9a3d00;padding:0 30px}
.bigdoor{font-size:110px;text-align:center;margin:10px 0;animation:bob 2s ease-in-out infinite}
.flash{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none}
.flash span{font-family:var(--disp);font-size:min(20vh,22vw);color:var(--gold);text-shadow:0 8px 0 #0009;animation:slam .9s cubic-bezier(.2,1.6,.4,1) both}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--paper);color:var(--paperInk);border-radius:20px;padding:22px;max-width:480px;width:100%;text-align:center;font-size:20px;animation:pop .35s both}
.foot{margin-top:28px;text-align:center}
.foot button{background:none;border:0;color:#ffffff55;font-family:var(--body);font-size:15px;cursor:pointer;text-decoration:underline}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:45}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes slam{from{transform:scale(3);opacity:0}60%{opacity:1}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header><span class="logo" id="home">🔐 고려 방탈출</span><div class="keys" id="keys"></div>
  <button class="icon" id="snd" aria-label="소리 켜고 끄기">🔊</button></header>
  <main id="app"></main>
  <div class="foot"><button id="restart">처음부터 다시 하기</button></div>
</div>
<script>
/* ===== 방 데이터 ===== */
var ROOMS=[
 {id:'r1',name:'개경 귀족의 집',emo:'🏯',key:'신분',
  clues:[{type:'유적',name:'박익 벽화묘의 그림',when:'고려 말 · 경상남도 밀양',src:'교과서 58쪽',text:'고려 관리 박익의 무덤 벽에 그려진 그림이에요. 여러 사람이 술병과 음식, 물건을 들고 줄지어 서 있어요. 무덤 주인의 시중을 들러 가는 사람들이에요.'},
         {type:'기록',name:'노비 만적의 외침',when:'1198년 · 『고려사』',src:'교과서 58쪽 · 검색어: 만적',text:'고려에서 노비는 주인의 재산처럼 여겨져 사고팔리기도 했어요. 어느 날 노비 만적이 다른 노비들을 모아 외쳤어요. “장군과 재상이 될 씨가 어찌 따로 있겠는가? 노비 문서를 불태우자!” 하지만 계획이 들켜 붙잡히고 말았어요.'}],
  q:'두 쪽지에 함께 나오는 사람은 누구일까요?',
  opts:[['주인을 섬기며 일하는 사람(노비)',1,''],['과거 시험을 보는 선비',0,'선비는 두 쪽지 어디에도 없어요.'],['외국에서 온 상인',0,'상인은 두 쪽지 어디에도 없어요.'],['절의 스님',0,'스님은 나오지 않아요. 다시 읽어 봐요!']],
  think:'두 쪽지를 보면, 고려 사람들은 모두 똑같이 살았을까요?'},
 {id:'r2',name:'과거 시험장',emo:'📜',key:'유교',
  clues:[{type:'제도',name:'과거 시험',when:'고려 · 나라의 제도',src:'교과서 53쪽',text:'고려는 나라에서 일할 관리를 뽑으려고 과거 시험을 열었어요. 시험에는 유교 책의 내용이 중요하게 나왔어요. 나라는 개경과 지방에 학교를 세워 유교를 가르쳤어요.'},
         {type:'기록',name:'최승로가 올린 글',when:'982년 · 『고려사』',src:'검색어: 최승로 시무 28조',text:'신하 최승로가 성종 임금께 글을 올렸어요. “불교는 몸과 마음을 닦는 바탕이고, 유교는 나라를 다스리는 바탕입니다.” 성종은 이 말을 받아들여 유교에 맞게 나라의 제도를 정비했어요.'}],
  q:'두 쪽지에 함께 나오는 것은 무엇일까요?',
  opts:[['유교',1,''],['불교',0,'불교는 쪽지 ②에만 나와요.'],['노비',0,'노비는 두 쪽지에 나오지 않아요.'],['무역',0,'무역은 두 쪽지에 나오지 않아요.']],
  think:'두 쪽지를 보면, 고려는 나라를 무엇으로 다스렸을까요? 관리가 되고 싶은 사람은 무엇을 했을까요?'},
 {id:'r3',name:'등불 거리',emo:'🏮',key:'불교',
  clues:[{type:'행사',name:'연등회',when:'해마다 봄',src:'교과서 61쪽',text:'연등회는 나라의 지원을 받아 열린 불교 행사예요. 사람들은 전국 곳곳에서 등불을 밝히고 줄지어 돌아다니며 소원을 빌었어요. 왕부터 백성까지 모두 함께했어요.'},
         {type:'생활',name:'마을의 절',when:'고려 · 전국 곳곳',src:'교과서 60쪽',text:'개경뿐 아니라 전국 곳곳에 절이 세워졌어요. 사람들은 절에서 가족의 건강과 마을의 평안을 빌었어요. 절은 쌀을 빌려주고 물건을 사고팔기도 했어요. 장례와 제사도 불교식으로 지내는 사람이 많았어요.'}],
  q:'두 쪽지에서 사람들이 함께 한 일은 무엇일까요?',
  opts:[['부처님께 소원을 빌었다',1,''],['과거 시험을 보았다',0,'과거 시험은 두 쪽지에 나오지 않아요.'],['재산을 나누었다',0,'재산 나누기는 나오지 않아요.'],['외국과 물건을 바꾸었다',0,'외국은 나오지 않아요. 다시 읽어 봐요!']],
  think:'두 쪽지를 보면, 불교는 고려 사람들의 생활에 어떤 역할을 했을까요?'},
 {id:'r4',name:'어머니의 안방',emo:'🏠',key:'가족',
  clues:[{type:'기록',name:'어머니의 재산 나누기',when:'『고려사』',src:'교과서 59쪽',text:'나익희의 어머니는 여섯 남매에게 재산을 나눠 줄 때, 외아들인 나익희에게만 노비 40명을 더 주려 했어요. 나익희는 “외아들이라고 더 받으면 남매가 화목할 수 없습니다.”라며 사양했어요. 어머니는 그 말이 옳다며 그대로 따랐어요.'},
         {type:'기록',name:'손변의 재판',when:'『고려사』',src:'검색어: 손변',text:'한 아버지가 딸에게 재산을 모두 주고, 어린 아들에게는 옷과 갓, 종이 한 권만 남겼어요. 다 자란 남매가 재판을 하자 관리 손변이 말했어요. “아들이 크면 이 종이에 글을 써 억울함을 알리라는 뜻이다. 자식에게 줄 재산은 똑같아야 한다.” 손변은 재산을 반씩 나누게 했어요.'}],
  q:'두 쪽지에 함께 나오는 생각은 무엇일까요?',
  opts:[['아들과 딸에게 재산을 똑같이 나눠야 한다',1,''],['재산은 아들만 받아야 한다',0,'두 쪽지를 다시 봐요. 누가 얼마나 받았나요?'],['노비 문서를 불태워야 한다',0,'그건 다른 방 이야기예요!'],['유교 책을 공부해야 한다',0,'공부 이야기는 나오지 않아요.']],
  secret:'🔍 <b>숨은 쪽지 발견!</b> “하지만 고려의 여성은 과거 시험을 볼 수 없었고, 벼슬에 오를 수도 없었다.” <small>(교과서 59쪽)</small>',
  think:'두 쪽지와 숨은 쪽지를 보면, 고려 여성의 모습은 집 안에서와 나라 일에서 어떻게 달랐을까요?'},
 {id:'r5',name:'벽란도 항구',emo:'⛵',key:'교류',
  clues:[{type:'유적',name:'국제 무역항 벽란도',when:'고려 · 예성강',src:'교과서 56~57쪽',text:'벽란도는 수도 개경 가까이에 있던 큰 항구예요. 송나라 상인은 물론 멀리 아라비아 상인까지 드나들었어요. 고려는 인삼, 종이, 청자를 팔고 비단, 책, 약재를 사 왔어요.'},
