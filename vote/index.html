<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아주 오래전, 내가 살았다면?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<link rel="stylesheet" href="style.css?v=2">
<style>
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:max(18px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:clamp(24px,7vw,34px);line-height:1.2}
.me{font-family:var(--disp);background:var(--gold);color:#1a1530;border-radius:999px;padding:6px 14px;font-size:20px;white-space:nowrap;border:0;cursor:pointer;box-shadow:0 4px 0 #b88a00}
.lead{font-size:20px;color:var(--gold);text-align:center}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.nums button{font-family:var(--disp);font-size:30px;aspect-ratio:1;border-radius:20px;border:0;cursor:pointer;color:#1a1530;
  background:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 50%,#000);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.nums button:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 50%,#000)}
.wait{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.wait .big{font-family:var(--disp);font-size:clamp(28px,8vw,40px);line-height:1.3}
.wait .big b{color:var(--gold)}
.parade{display:flex;gap:10px;font-size:42px}
.parade span{animation:bob 1.6s ease-in-out infinite}
.parade span:nth-child(2){animation-delay:-.3s}.parade span:nth-child(3){animation-delay:-.6s}.parade span:nth-child(4){animation-delay:-.9s}.parade span:nth-child(5){animation-delay:-1.2s}
.bar{position:relative;height:18px;border-radius:999px;background:#ffffff14;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),var(--hot));border-radius:999px;transition:width .1s linear}
.clock{display:flex;align-items:center;gap:12px}
.clock .s{font-family:var(--disp);font-size:44px;color:var(--gold);min-width:2ch;text-align:right}
.clock.hurry .s{color:var(--hot);animation:thump .5s infinite}
.clock .bar{flex:1}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{position:relative;border-radius:22px;border:4px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,#0000),color-mix(in srgb,var(--c) 8%,#0000));
  color:var(--ink);font:inherit;cursor:pointer;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;transition:transform .1s}
.pk:nth-child(5){grid-column:1/-1}
.pk:active{transform:translateY(4px)}
.pk .e{font-size:48px;line-height:1}
.pk .n{font-family:var(--disp);font-size:21px;line-height:1.2;word-break:keep-all}
.pk .d{font-size:14px;color:var(--dim);word-break:keep-all}
.pk.sel{background:var(--c);color:#1a1530;transform:scale(1.03);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#000),0 0 30px var(--c)}
.pk.sel .d{color:#1a1530aa}
.pk.sel::after{content:"✔";position:absolute;top:6px;right:10px;font-family:var(--disp);font-size:26px}
.pk.off{opacity:.35}
.note{text-align:center;font-size:18px;color:var(--dim);min-height:1.4em}
.note b{color:var(--gold)}
.mine{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mine .e{font-size:84px;line-height:1;animation:bob 2s infinite}
.mine .t{font-family:var(--disp);font-size:28px}
.res{display:flex;flex-direction:column;gap:12px}
.row{border-radius:18px;border:3px solid var(--c);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--c) 10%,#0000)}
.row.me-in{box-shadow:0 0 0 3px #fff,0 0 24px var(--c)}
.row .h{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:20px}
.row .h .c{margin-left:auto;color:var(--c);font-size:24px}
.row .chips{display:flex;flex-wrap:wrap;gap:6px}
.row .chip{font-size:16px}
.row .chip.you{outline:3px solid #fff;outline-offset:2px}
.row.win .h::after{content:"👑";font-size:22px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:16px;z-index:30;max-width:90vw;text-align:center}
.off-line{position:fixed;top:0;left:0;right:0;background:var(--hot);color:#fff;text-align:center;font-size:14px;padding:4px}
</style>
</head><body>
<canvas id="stars"></canvas>
<div class="wrap" id="app"></div>
<div class="flash" id="flash" hidden><span>땡!</span></div>
<div class="off-line" id="offline" hidden>연결이 잠깐 끊겼어요. 다시 이어 볼게요…</div>
<script src="common.js?v=2"></script>
<script>
(function(){
"use strict";
stars(document.getElementById("stars"));
var me = parseInt(lsGet("vote.me","0"),10) || 0;
var ST=null, lastPhase=null, myPick=null, myRound=null, pending=false, ticker=null, polling=false;
var app=$("#app");

function toast(m){ var t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }
function head(){ return '<div class="top"><h1>아주 오래전,<br>내가 살았다면?</h1>'+(me?'<button class="me" id="chg" type="button">'+me+'번</button>':'')+'</div>'; }
function bindHead(){ var b=$("#chg"); if(b) b.onclick=function(){ if(ST && ST.phase==="vote") return toast("고르는 중에는 번호를 바꿀 수 없어요."); me=0; lsSet("vote.me","0"); render(); }; }

/* ---------- 번호 고르기 ---------- */
function renderNums(){
  var h=head()+'<div class="lead">내 번호를 눌러요</div><div class="nums">';
  for(var i=1;i<=N;i++){ h+='<button type="button" data-n="'+i+'" style="--c:'+OPTS[(i-1)%OPTS.length].c+';animation-delay:'+(i*0.02)+'s">'+i+'</button>'; }
  app.innerHTML=h+'</div>';
  [].forEach.call(app.querySelectorAll(".nums button"),function(b){ b.onclick=function(){ audio(); sfx.pick(); me=+b.dataset.n; lsSet("vote.me",String(me)); myPick=null; render(); }; });
}

/* ---------- 화면 ---------- */
function render(){
  clearInterval(ticker);
  if(!me) return renderNums();
  var ph = ST ? ST.phase : "wait";
  if(!VOTE_API){ app.innerHTML=head()+'<div class="wait"><div class="big">아직 준비 중이에요</div></div>'; return bindHead(); }
  if(ph==="wait"){
    app.innerHTML=head()+'<div class="wait"><div class="parade">'+OPTS.map(function(o){return '<span>'+o.emo+'</span>';}).join("")+'</div>'+
      '<div class="big"><b>'+me+'번</b> 준비 완료!<br>선생님이 시작하면<br>딱 하나를 골라요</div><div class="note">화면을 끄지 말고 기다려요</div></div>';
  } else if(ph==="vote"){
    app.innerHTML=head()+'<div class="clock" id="clock"><div class="s" id="sec"></div><div class="bar"><i id="fill"></i></div></div>'+
      '<div class="lead">딱 하나 더 가질 수 있다면?</div><div class="picks" id="picks">'+
      OPTS.map(function(o,i){ return '<button type="button" class="pk" data-k="'+i+'" style="--c:'+o.c+';animation-delay:'+(i*0.06)+'s"><span class="e">'+o.emo+'</span><span class="n">'+o.nm+'</span><span class="d">'+o.ds+'</span></button>'; }).join("")+
      '</div><div class="note" id="note"></div>';
    [].forEach.call(app.querySelectorAll(".pk"),function(b){ b.onclick=function(){ pick(+b.dataset.k); }; });
    markPick(); startTicker();
  } else if(ph==="closed"){
    var o = myPick!=null ? OPTS[myPick] : null;
    app.innerHTML=head()+'<div class="wait">'+(o?'<div class="mine"><div class="e">'+o.emo+'</div><div class="t">나는 '+o.nm+'!</div></div><div class="big">왜 골랐는지<br><b>이유</b>를 생각해 봐요</div>':'<div class="big">시간이 끝났어요<br>다음에 꼭 골라요!</div>')+'<div class="note">곧 결과가 나와요</div></div>';
  } else if(ph==="result"){
    renderResult();
  }
  bindHead();
}
function renderResult(){
  var by=OPTS.map(function(){return [];}), v=ST.votes||{};
  Object.keys(v).forEach(function(n){ if(by[+v[n]]) by[+v[n]].push(+n); });
  by.forEach(function(a){a.sort(function(x,y){return x-y;});});
  var max=Math.max.apply(null,by.map(function(a){return a.length;}));
  var mk = v[me]!=null ? +v[me] : null;
  var h=head()+(mk!=null?'<div class="mine"><div class="e">'+OPTS[mk].emo+'</div><div class="t">나는 '+OPTS[mk].nm+'!</div></div>':'')+
    '<div class="lead">우리 반은 이렇게 골랐어요</div><div class="res">';
  OPTS.forEach(function(o,i){
    h+='<div class="row'+(i===mk?' me-in':'')+(max>0&&by[i].length===max?' win':'')+'" style="--c:'+o.c+'"><div class="h"><span>'+o.emo+'</span><span>'+o.nm+'</span><span class="c">'+by[i].length+'명</span></div>'+
      '<div class="chips">'+by[i].map(function(n){return '<span class="chip'+(n===me?' you':'')+'" style="--c:'+o.c+'">'+n+'</span>';}).join("")+'</div></div>';
  });
  app.innerHTML=h+'</div><div class="note">왜 골랐는지 친구들과 이야기해 봐요</div>';
}
function markPick(){
  [].forEach.call(app.querySelectorAll(".pk"),function(b){ var k=+b.dataset.k; b.classList.toggle("sel",k===myPick); b.classList.toggle("off",myPick!=null&&k!==myPick); });
  var n=$("#note"); if(n) n.innerHTML = myPick!=null ? (pending?'보내는 중…':'<b>골랐어요!</b> 시간 안에는 바꿀 수 있어요') : '하나를 눌러요';
}
function pick(k){
  if(!ST || ST.phase!=="vote") return;
  audio(); sfx.pick();
  var prev=myPick; myPick=k; pending=true; markPick();
  gs("vote",{n:me,k:k,round:ST.round}).then(function(r){ pending=false; myRound=ST.round; markPick(); }, function(e){ pending=false; myPick=prev; markPick(); toast(errMsg(e)); });
}
function startTicker(){
  var last=-1, total=Math.max(1,(ST.endsAt-ST.round)/1000);
  ticker=setInterval(function(){
    var left=Math.max(0,(ST.endsAt-serverNow())/1000), s=Math.ceil(left);
    var se=$("#sec"), fi=$("#fill"), cl=$("#clock"); if(!se){clearInterval(ticker);return;}
    se.textContent=s; fi.style.width=(left/total*100)+"%"; cl.classList.toggle("hurry",s<=5);
    if(s!==last){ last=s; if(s>0&&s<=5) sfx.tick(); }
    if(left<=0){ clearInterval(ticker); ST.phase="closed"; lastPhase="closed"; flash(); render(); }
  },100);
}
function flash(){ sfx.buzz(); var f=$("#flash"); f.hidden=false; var sp=f.firstElementChild; sp.style.animation="none"; void sp.offsetHeight; sp.style.animation=""; setTimeout(function(){f.hidden=true;},1200); }

/* ---------- 서버 ---------- */
function apply(st){
  if(st.phase==="vote" && serverNow()>=st.endsAt) st.phase="closed";
  var newRound = !ST || st.round!==ST.round;
  ST=st;
  if(newRound && st.phase==="vote"){ myPick = (st.mine!=null) ? st.mine : null; }
  else if(st.mine!=null && !pending) myPick=st.mine;
  if(st.phase==="wait") myPick=null;
  if(st.phase!==lastPhase){
    if(st.phase==="vote" && lastPhase){ audio(); sfx.start(); if(navigator.vibrate) try{navigator.vibrate(200);}catch(e){} }
    if(st.phase==="result" && lastPhase) sfx.fan();
    lastPhase=st.phase; render();
  }
}
function poll(once){
  if(polling) return; polling=true;
  var t=Date.now();
  gs("state",{n:me}).then(function(st){ $("#offline").hidden=true; syncClock(st,t); apply(st); }, function(){ $("#offline").hidden=false; })
    .then(function(){ polling=false; if(!once) setTimeout(poll, document.hidden?4000:1500); });
}
document.addEventListener("pointerdown",function(){ audio(); },{once:true});
render();
if(VOTE_API) poll();
})();
</script>
</body></html>
